<!DOCTYPE html>
<html lang="en">
<head>
<script src="gate.js?v=2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Things we did together</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,500&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#1c110c; --deep:#3b2418; --rose:#e8c4a0; --gold:#d4a26a; --mist:#eadccf; --dim:#a58b78;
  --serif:"Fraunces",Georgia,"Times New Roman",serif; --sans:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:linear-gradient(var(--night),var(--deep)) fixed,var(--night);color:var(--mist);font-family:var(--sans);font-size:17px;line-height:1.6}
h1{font-family:var(--serif);font-weight:300;font-style:italic;color:#fff;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.12;text-align:center;margin:56px 0 10px}
main{max-width:560px;margin:0 auto;padding:40px 24px 96px}
.back{display:inline-block;color:var(--rose);text-decoration:none;border:1px solid var(--rose);padding:10px 22px;border-radius:999px;font-weight:500}
.back:hover,.back:focus-visible{background:var(--rose);color:var(--night)}
.back:focus-visible{outline:2px solid #fff;outline-offset:3px}
.sub{text-align:center;color:var(--dim);margin:0 0 40px}
button{font:inherit;color:inherit}

/* Player */
.player{background:#00000040;border:1px solid #d4a26a33;border-radius:22px;padding:24px;margin-bottom:28px}
.art{position:relative;width:min(280px,100%);aspect-ratio:1;margin:0 auto 24px;border-radius:50%;overflow:hidden;background:#2a1a12;box-shadow:0 18px 40px #00000066,0 0 0 6px #0000004d;display:flex;align-items:center;justify-content:center;animation:spin 14s linear infinite;animation-play-state:paused}
.art.playing{animation-play-state:running}
.art::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(circle,transparent 0 3px,#0000001f 3px 4px),radial-gradient(circle at 30% 25%,#ffffff26,transparent 45%)}
.art::after{content:"";position:absolute;left:50%;top:50%;width:13%;height:13%;margin:-6.5% 0 0 -6.5%;border-radius:50%;background:var(--night);border:3px solid #e8c4a0aa;pointer-events:none}
.art.nc::after{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.art{animation:none}}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art svg{width:38%;height:38%;opacity:.5}
.meta{text-align:center;margin-bottom:18px}
.meta .t{font-family:var(--serif);font-size:1.5rem;color:#fff;line-height:1.25}
.meta .a{color:var(--dim)}
.meta .n{margin-top:.5rem;font-style:italic;color:var(--gold);font-size:.98rem}
.bar{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--dim);font-variant-numeric:tabular-nums}
.bar input{flex:1;accent-color:var(--rose);height:4px;cursor:pointer}
.ctl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:14px}
.ib{background:none;border:0;color:var(--rose);width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib svg{width:26px;height:26px;fill:currentColor}
.ib:hover{background:#e8c4a01f}
.ib:focus-visible,.pp:focus-visible,.row:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pp{width:68px;height:68px;border-radius:50%;border:0;background:var(--rose);color:var(--night);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px 4px #e8c4a044}
.pp svg{width:30px;height:30px;fill:currentColor}
.pp:hover{transform:scale(1.05)}

/* Track list */
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:26px 48px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:8px 10px;cursor:pointer}
.row:hover{background:#e8c4a014}
.row.on{background:#e8c4a026}
.row .no{color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.row .th{width:48px;height:48px;border-radius:8px;overflow:hidden;background:#2a1a12;display:flex;align-items:center;justify-content:center}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row .th svg{width:50%;height:50%;opacity:.5}
.row .tx{min-width:0}
.row .tt{display:block;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ar{display:block;color:var(--dim);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .tt{color:var(--rose)}
.row .du{color:var(--dim);font-size:.88rem;font-variant-numeric:tabular-nums}

/* Tabs */
.tabs{display:flex;gap:6px;margin:0 0 32px;background:#00000040;border:1px solid #d4a26a33;border-radius:999px;padding:5px}
.tabs button{flex:1;border:0;background:none;color:var(--dim);padding:10px 10px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.92rem;line-height:1.25}
.tabs button[aria-selected="true"]{background:var(--rose);color:var(--night)}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Foods */
.foods{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.fph{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;padding:0;border:1px solid #d4a26a44;border-radius:16px;overflow:hidden;background:#2a1a12;cursor:default}
.fph.has{cursor:zoom-in}
.fph img{width:100%;height:100%;object-fit:cover;display:block}
.fph svg{width:34%;height:34%;fill:#e8c4a0;opacity:.45}
.fph:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fname{margin-top:.6rem;text-align:center;font-family:var(--serif);font-size:1.15rem;color:#fff;line-height:1.3}
.first{margin-top:56px;padding-top:40px;border-top:1px solid #d4a26a33;text-align:center}
.first p{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.4rem,5vw,1.9rem);color:#fff;line-height:1.35}
.fp{max-width:340px;margin:0 auto 24px}
.fp img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid #d4a26a44;cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:10;background:#000000e6;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.meta .t,.meta .a,.row .tt,.row .ar{unicode-bidi:plaintext}
.empty{text-align:center;color:var(--dim)}
.foot{text-align:center;margin-top:72px}
</style>
</head>
<body>
<main>
  <a class="back" href="us.html">Back</a>
  <h1>Things we did together</h1>
  <p class="sub">Our favorite things, one bite and one song at a time.</p>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tb-food" aria-selected="true" aria-controls="tab-food">Foods we ate together</button>
    <button type="button" role="tab" id="tb-music" aria-selected="false" aria-controls="tab-music">Music we listened to together</button>
  </div>

  <section id="tab-food" role="tabpanel" aria-labelledby="tb-food">
    <ul class="foods" id="foods"></ul>
    <div class="first">
      <div class="fp" id="firstph" hidden></div>
      <p>The first time we shared food together</p>
    </div>
  </section>


  <section id="tab-music" role="tabpanel" aria-labelledby="tb-music" hidden>
  <section class="player" id="player" hidden>
    <div class="art" id="art"></div>
    <div class="meta">
      <div class="t" id="title"></div>
      <div class="a" id="artist"></div>
      <div class="n" id="note"></div>
    </div>
    <div class="bar">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
    <div class="ctl">
      <button class="ib" id="prev" type="button" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="pp" id="pp" type="button" aria-label="Play"></button>
      <button class="ib" id="next" type="button" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </section>

  <ol class="list" id="list"></ol>
  <p class="empty" id="empty" hidden>More soon.</p>
  </section>

  <div class="foot"><a class="back" href="us.html">Back</a></div>
</main>
<audio id="au" preload="metadata"></audio>
<div class="lb" id="lb" role="dialog" aria-label="Photo, full size"><img id="lbimg" alt=""></div>

<script>
/* ===== EDIT THESE (optional): a title, artist and a little memory for each song, in the same order as the files =====
   ["Song title", "Artist", "What we did when we heard it"]  (leave "" for anything you don't want to show) */
var INFO = [
  ["حواديت", "محمد منير", ""],
  ["شبابيك", "محمد منير", ""],
  ["بتمون", "اليسا", ""],
  ["علم قلبي", "عمرو دياب", ""]
];
/* =====================================================================================================
   Files go next to this page:  song1.mp3, song2.mp3 ...   (mp3, m4a, wav, ogg; 01 style names also work)
   Album pictures:              cover1.jpeg, cover2.jpeg ... (jpeg, jpg, png, webp)
   Any number works. The number matches: song1 uses cover1. */

var AUDIO_EXTS = ['mp3', 'm4a', 'wav', 'ogg'], IMG_EXTS = ['jpeg', 'jpg', 'png', 'webp'];
var NOTE_SVG = '<svg viewBox="0 0 24 24" fill="#e8c4a0"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>';
var PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
var PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

var au = document.getElementById('au'), pp = document.getElementById('pp'), seek = document.getElementById('seek');
var tracks = [], cur = -1, rows = [];
pp.innerHTML = PLAY;

function names(prefix, i, exts) {
  var nums = i < 10 ? [String(i), '0' + i] : [String(i)], out = [];
  nums.forEach(function (n) { exts.forEach(function (e) { out.push(prefix + n + '.' + e); }); });
  return out;
}
function findAudio(list, k, cb) {
  if (k >= list.length) { cb(null); return; }
  fetch(list[k], { method: 'HEAD' }).then(function (r) { if (r.ok) cb(list[k]); else findAudio(list, k + 1, cb); })
    .catch(function () { findAudio(list, k + 1, cb); });
}
function findCover(list, k, cb) {
  if (k >= list.length) { cb(null); return; }
  var im = new Image();
  im.onload = function () { cb(list[k]); };
  im.onerror = function () { findCover(list, k + 1, cb); };
  im.src = list[k];
}
function fmt(s) {
  if (!isFinite(s)) return '0:00';
  var m = Math.floor(s / 60), r = Math.floor(s % 60);
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function infoFor(i) {
  var d = INFO[i] || [];
  return { title: d[0] || ('Song ' + (i + 1)), artist: d[1] || '', note: d[2] || '' };
}
function setArt(el, cover) {
  el.innerHTML = '';
  if (cover) { var im = new Image(); im.alt = ''; im.src = cover; el.appendChild(im); } else { el.innerHTML = NOTE_SVG; }
}

function addTrack(t, i) {
  var inf = infoFor(i);
  var li = document.createElement('li'), b = document.createElement('button');
  b.className = 'row'; b.type = 'button';
  b.innerHTML = '<span class="no"></span><span class="th"></span><span class="tx"><span class="tt"></span><span class="ar"></span></span><span class="du"></span>';
  b.querySelector('.no').textContent = i + 1;
  setArt(b.querySelector('.th'), t.cover);
  b.querySelector('.tt').textContent = inf.title;
  b.querySelector('.ar').textContent = inf.artist;
  b.addEventListener('click', function () {
    if (cur === i) { if (au.paused) au.play(); else au.pause(); } else { select(i, true); }
  });
  li.appendChild(b); document.getElementById('list').appendChild(li);
  rows[i] = b;
  var a = new Audio(); a.preload = 'metadata';
  a.onloadedmetadata = function () { b.querySelector('.du').textContent = fmt(a.duration); };
  a.src = t.src;
}

function select(i, play) {
  if (i < 0 || i >= tracks.length) return;
  cur = i;
  var t = tracks[i], inf = infoFor(i);
  au.src = t.src;
  setArt(document.getElementById('art'), t.cover);
  document.getElementById('art').classList.toggle('nc', !t.cover);
  document.getElementById('title').textContent = inf.title;
  document.getElementById('artist').textContent = inf.artist;
  document.getElementById('note').textContent = inf.note;
  seek.value = 0; document.getElementById('cur').textContent = '0:00'; document.getElementById('dur').textContent = '0:00';
  rows.forEach(function (r, k) { r.classList.toggle('on', k === i); });
  if ('mediaSession' in navigator && window.MediaMetadata) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: inf.title, artist: inf.artist || 'For Hanoon',
      artwork: t.cover ? [{ src: t.cover }] : []
    });
  }
  if (play) au.play().catch(function () {});
}
function step(d) { if (tracks.length) select((cur + d + tracks.length) % tracks.length, true); }

pp.addEventListener('click', function () { if (cur < 0) return; if (au.paused) au.play(); else au.pause(); });
document.getElementById('prev').addEventListener('click', function () { step(-1); });
document.getElementById('next').addEventListener('click', function () { step(1); });
au.addEventListener('play', function () { document.getElementById('art').classList.add('playing'); pp.innerHTML = PAUSE; pp.setAttribute('aria-label', 'Pause'); });
au.addEventListener('pause', function () { document.getElementById('art').classList.remove('playing'); pp.innerHTML = PLAY; pp.setAttribute('aria-label', 'Play'); });
au.addEventListener('ended', function () { step(1); });
au.addEventListener('loadedmetadata', function () { document.getElementById('dur').textContent = fmt(au.duration); });
au.addEventListener('timeupdate', function () {
  document.getElementById('cur').textContent = fmt(au.currentTime);
  if (au.duration) seek.value = Math.round(au.currentTime / au.duration * 1000);
});
seek.addEventListener('input', function () { if (au.duration) au.currentTime = seek.value / 1000 * au.duration; });
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', function () { au.play(); });
  navigator.mediaSession.setActionHandler('pause', function () { au.pause(); });
  navigator.mediaSession.setActionHandler('previoustrack', function () { step(-1); });
  navigator.mediaSession.setActionHandler('nexttrack', function () { step(1); });
}

/* find the songs in order, and stop when they run out */
function next(i, misses) {
  if (misses >= 3 || i > 200) {
    if (!tracks.length) document.getElementById('empty').hidden = false;
    return;
  }
  findAudio(names('song', i, AUDIO_EXTS), 0, function (src) {
    if (!src) { next(i + 1, misses + 1); return; }
    findCover(names('cover', i, IMG_EXTS), 0, function (cover) {
      var t = { src: src, cover: cover };
      tracks.push(t);
      addTrack(t, tracks.length - 1);
      if (tracks.length === 1) { document.getElementById('player').hidden = false; select(0, false); }
      next(i + 1, 0);
    });
  });
}
next(1, 0);

/* ===== Foods =====
   Photos go next to this page, in the same order as the list:
   food1.jpeg (Zinger Rocket), food2.jpeg (Shawarma Pie), food3.jpeg (Lemon Mint), food4.jpeg (Pepsi)
   and an optional firstfood.jpeg for the "first time we shared food" moment. jpeg, jpg, png, webp all work.
   To add more foods, add a name to the list and a matching photo (food5.jpeg ...). */
var FOODS = ['Zinger Rocket', 'Chicken Shawarma Pie', 'V-Cola Lemon Mint', 'V-Cola Pepsi'];
var FORK_SVG = '<svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>';
var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
function zoom(src) { lbimg.src = src; lb.classList.add('on'); }
lb.addEventListener('click', function () { lb.classList.remove('on'); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lb.classList.remove('on'); });

FOODS.forEach(function (name, k) {
  var li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.className = 'fph'; b.innerHTML = FORK_SVG; b.setAttribute('aria-label', name + ' photo');
  var nm = document.createElement('div'); nm.className = 'fname'; nm.textContent = name;
  li.appendChild(b); li.appendChild(nm);
  document.getElementById('foods').appendChild(li);
  findCover(names('food', k + 1, IMG_EXTS), 0, function (src) {
    if (!src) return;
    b.innerHTML = ''; b.classList.add('has');
    var im = new Image(); im.alt = name; im.src = src; b.appendChild(im);
    b.addEventListener('click', function () { zoom(src); });
  });
});
(function () {
  var cand = IMG_EXTS.map(function (e) { return 'firstfood.' + e; });
  findCover(cand, 0, function (src) {
    if (!src) return;
    var box = document.getElementById('firstph'), im = new Image();
    im.alt = 'The first time we shared food together'; im.src = src;
    im.addEventListener('click', function () { zoom(src); });
    box.appendChild(im); box.hidden = false;
  });
})();

/* ===== Tabs ===== */
function showTab(which) {
  var food = which === 'food';
  document.getElementById('tab-food').hidden = !food;
  document.getElementById('tab-music').hidden = food;
  document.getElementById('tb-food').setAttribute('aria-selected', food);
  document.getElementById('tb-music').setAttribute('aria-selected', !food);
}
document.getElementById('tb-food').addEventListener('click', function () { showTab('food'); });
document.getElementById('tb-music').addEventListener('click', function () { showTab('music'); });
</script>
<script src="collage.js?v=3" defer></script>
</body>
</html>
